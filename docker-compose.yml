version: "3.8"
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
  backend:
    build: ./backend
    env_file: .env
    depends_on:
      - db
    ports:
      - "8000:8000"
  bot:
    build: ./bot
    env_file: .env
    depends_on:
      - backend
  webapp:
    build: ./webapp
    env_file: .env
    ports:
      - "3000:3000"
volumes:
  db_data:
